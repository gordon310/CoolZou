services:
  app:
    build:
      context: ..
    env_file:
      - ${COOLZOU_ENV_FILE:-../.env.production}
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2.0
    pids_limit: 128
    ulimits:
      core: 0
    stop_grace_period: 25s
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      MALLOC_ARENA_MAX: "2"
    labels:
      com.coolzou.managed: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "4317"
    volumes:
      - coolzou-data:/app/var

  edge:
    image: nginx:1.28-alpine
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    labels:
      com.coolzou.managed: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/edge-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro

volumes:
  coolzou-data:
